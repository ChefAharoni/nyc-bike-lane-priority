[project]
name = "pipeline"
version = "0.1.0"
description = "Data pipeline that ranks NYC streets for protected bike lanes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "geopandas",
    "shapely>=2",
    "pyogrio",
    "networkx",
    "requests",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
